# ─────────────────────────────────────────
#  Site Settings
# ─────────────────────────────────────────
title: "Rupesh's Blog"
tagline: "Notes on machine learning, books & ideas"
description: "A personal blog on technology, research, books, and more."

# GitHub Pages URL — update after you create the repo
# For username.github.io repos use: https://username.github.io
# For project repos use: https://username.github.io  +  baseurl: /repo-name
url: "https://rupesh4604.github.io/"
baseurl: ""

author:
  name: "Rupesh Kumar Yadav Mediboyina"
  email: "rupesh32003@gmail.com"
  github: "rupesh4604"          # fill in your GitHub handle

# ─────────────────────────────────────────
#  Build Settings
# ─────────────────────────────────────────
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    default_lang: text

# ─────────────────────────────────────────
#  Plugins  (all GitHub Pages-compatible)
# ─────────────────────────────────────────
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# ─────────────────────────────────────────
#  Pagination
# ─────────────────────────────────────────
paginate: 8
paginate_path: "/page/:num/"

# ─────────────────────────────────────────
#  Default Front Matter
# ─────────────────────────────────────────
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
  - scope:
      path: "pages"
      type: "pages"
    values:
      layout: "page"

# ─────────────────────────────────────────
#  Navigation Links
# ─────────────────────────────────────────
nav_links:
  - title: "Archive"
    url: "/pages/archive"
  - title: "Tags"
    url: "/pages/tags"
  - title: "Series"
    url: "/pages/series"
  - title: "About"
    url: "/pages/about"

# ─────────────────────────────────────────
#  Exclude from build
# ─────────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  - .sass-cache
  - node_modules
