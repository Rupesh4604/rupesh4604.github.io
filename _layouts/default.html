<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  {% include head.html %}
</head>
<body>

  {% include header.html %}

  <div class="page-wrapper">
    <main class="main-content" id="main-content">
      {{ content }}
    </main>

    <aside class="sidebar-wrapper" aria-label="Sidebar">
      {% include sidebar.html %}
    </aside>
  </div>

  {% include footer.html %}

  <!-- ─── Search Modal ─── -->
  <div id="search-modal" class="search-modal" role="dialog" aria-modal="true" aria-label="Search" hidden>
    <div class="search-backdrop" id="search-backdrop"></div>
    <div class="search-panel">
      <div class="search-input-row">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search posts, tags, series…" autocomplete="off" spellcheck="false">
        <button class="search-close-btn" id="search-close" aria-label="Close search">✕</button>
      </div>
      <div id="search-results" class="search-results"></div>
      <p class="search-hint">Press <kbd>Esc</kbd> to close · <kbd>/</kbd> to open</p>
    </div>
  </div>

  <!-- Lunr.js (search engine) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lunr.js/2.3.9/lunr.min.js"
          integrity="sha512-4xUl/d6D6THrAnXAwGajXkO6BWCmZs74WcdZi+UpXi4r3NkHU64A5nh+MHrLZWoxoTQEqqhyknUNwhzybJ21A=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
