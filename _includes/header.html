<header class="site-header">
  <div class="header-inner">

    <!-- Logo / site title -->
    <a class="site-title" href="{{ '/' | relative_url }}">
      {{ site.title }}
    </a>

    <!-- Primary navigation -->
    <nav class="site-nav" aria-label="Main navigation">
      {% for link in site.nav_links %}
        <a href="{{ link.url | relative_url }}"
           class="nav-link{% if page.url == link.url %} active{% endif %}">
          {{ link.title }}
        </a>
      {% endfor %}
    </nav>

    <!-- Right-side controls -->
    <div class="header-controls">
      <!-- Search trigger -->
      <button class="icon-btn" id="search-trigger" aria-label="Open search" title="Search (/)">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>

      <!-- Dark / light mode toggle -->
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      <!-- Mobile menu toggle -->
      <button class="icon-btn mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

  </div>

  <!-- Mobile nav drawer -->
  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation">
    {% for link in site.nav_links %}
      <a href="{{ link.url | relative_url }}" class="mobile-nav-link">{{ link.title }}</a>
    {% endfor %}
  </nav>
</header>
